<svg width="640" height="480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b10"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>

  <!-- Grid accent lines -->
  <path d="M0 120 L640 120 M0 360 L640 360 M160 0 L160 480 M480 0 L480 480" stroke="#1f2937" stroke-width="1" opacity="0.3"/>

  <!-- Neon Blue "N" Logo Emblem -->
  <g transform="translate(320, 100)" filter="url(#glow)">
    <!-- Outer ring -->
    <circle r="42" fill="none" stroke="url(#neonGlow)" stroke-width="4" opacity="0.9"/>
    <!-- Stylized "N" Letter -->
    <path d="M -18,22 L -18,-22 L -4,-22 L 10,10 L 10,-22 L 18,-22 L 18,22 L 4,22 L -10,-10 L -10,22 Z" fill="url(#neonGlow)"/>
  </g>

  <!-- Title Text -->
  <text x="320" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">NOVA OS</text>
  <text x="320" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" letter-spacing="2">SUPERNOVA OPERATING SYSTEM</text>

  <!-- Bottom Accent bar -->
  <rect x="0" y="474" width="640" height="6" fill="url(#neonGlow)"/>
</svg>
