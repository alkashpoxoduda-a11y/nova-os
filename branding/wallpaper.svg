<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="60%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b92b27"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep space background -->
  <rect width="1920" height="1080" fill="url(#spaceBg)"/>

  <!-- Fluid modern macOS/Win11 style curved ribbon shapes -->
  <path d="M -100 800 Q 400 200, 1000 600 T 2100 200 L 2100 1200 L -100 1200 Z" fill="url(#neonCyan)" opacity="0.25" filter="url(#ultraGlow)"/>
  <path d="M -200 400 Q 600 900, 1400 300 T 2200 800 L 2200 1200 L -200 1200 Z" fill="url(#neonPurple)" opacity="0.2" filter="url(#ultraGlow)"/>

  <!-- Center emblem watermark -->
  <g transform="translate(960, 500)" opacity="0.15" filter="url(#ultraGlow)">
    <circle r="180" fill="none" stroke="url(#neonCyan)" stroke-width="12"/>
    <path d="M -70,90 L -70,-90 L -15,-90 L 40,40 L 40,-90 L 70,-90 L 70,90 L 15,90 L -40,-40 L -40,90 Z" fill="url(#neonCyan)"/>
  </g>
</svg>
