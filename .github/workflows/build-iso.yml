
name: Build NOVA OS

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Unit Tests
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            syslinux-utils \
            librsvg2-bin \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            debian-archive-keyring

      - name: Install Host rsvg Wrapper
        run: |
          sudo cat > /tmp/rsvg-wrapper <<'EOF'
          #!/bin/sh
          FORMAT="png"
          WIDTH="640"
          HEIGHT="480"
          INPUT=""
          OUTPUT=""

          while [ $# -gt 0 ]; do
              case "$1" in
                  --format) FORMAT="$2"; shift 2 ;;
                  --width) WIDTH="$2"; shift 2 ;;
                  --height) HEIGHT="$2"; shift 2 ;;
                  *)
                      if [ -z "$INPUT" ]; then
                          INPUT="$1"
                      elif [ -z "$OUTPUT" ]; then
                          OUTPUT="$1"
                      fi
                      shift
                      ;;
              esac
          done

          if [ -n "$INPUT" ] && [ -n "$OUTPUT" ]; then
              exec rsvg-convert -f "$FORMAT" -w "$WIDTH" -h "$HEIGHT" -o "$OUTPUT" "$INPUT"
          elif [ -n "$INPUT" ]; then
              exec rsvg-convert -f "$FORMAT" -w "$WIDTH" -h "$HEIGHT" "$INPUT"
          else
              exec rsvg-convert "$@"
          fi
          EOF
          sudo mv /tmp/rsvg-wrapper /usr/bin/rsvg
          sudo chmod +x /usr/bin/rsvg

      - name: Configure NOVA OS
        run: |
          chmod +x config/hooks/normal/*.hook.chroot

          sudo lb config \
            --mode debian \
            --system live \
            --initsystem systemd \
            --distribution trixie \
            --architectures amd64 \
            --linux-packages "linux-image" \
            --linux-flavours "amd64" \
            --bootloader syslinux \
            --firmware-chroot false \
            --firmware-binary false \
            --security false \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --debian-installer false \
            --iso-application "NOVA OS" \
            --iso-publisher "NOVA Project" \
            --iso-volume "NOVA_OS"

      - name: Pre-build Audit & Verification
        run: |
          echo "=== Pre-build Audit & Verification ==="
          if [ ! -x /usr/bin/rsvg ]; then
            echo "ERROR: /usr/bin/rsvg wrapper is missing on host!"
            exit 1
          fi
          if [ ! -f config/bootloaders/isolinux/isolinux.bin ] || [ -L config/bootloaders/isolinux/isolinux.bin ]; then
            echo "ERROR: config/bootloaders/isolinux/isolinux.bin missing or is a symlink!"
            exit 1
          fi
          if [ ! -f config/bootloaders/isolinux/vesamenu.c32 ] || [ -L config/bootloaders/isolinux/vesamenu.c32 ]; then
            echo "ERROR: config/bootloaders/isolinux/vesamenu.c32 missing or is a symlink!"
            exit 1
          fi
          if grep -rn "trixie/updates" config/; then
            echo "ERROR: Outdated 'trixie/updates' suite found in configuration!"
            exit 1
          fi
          if grep -rn "linux-generic" config/; then
            echo "ERROR: linux-generic found in effective configuration!"
            exit 1
          fi
          if grep -E "sysvinit-core|live-config-sysvinit|initscripts" config/package-lists/; then
            echo "ERROR: Conflicting SysV init packages detected in package list!"
            exit 1
          fi
          if grep -wE "lilo|linux-image-2\.6-amd64" config/package-lists/ || grep -w "grub" config/package-lists/; then
            echo "ERROR: Obsolete package requested in package list!"
            exit 1
          fi
          if [ ! -x config/hooks/normal/0001-syslinux-symlinks.hook.chroot ] || [ ! -x config/hooks/normal/0002-rsvg-wrapper.hook.chroot ]; then
            echo "ERROR: Syslinux or RSVG chroot hooks missing or not executable!"
            exit 1
          fi
          if ! grep -q 'LB_DEBIAN_INSTALLER="false"' config/binary; then
            echo "ERROR: LB_DEBIAN_INSTALLER is not false!"
            exit 1
          fi
          if ! grep -q 'LB_INITSYSTEM="systemd"' config/common; then
            echo "ERROR: LB_INITSYSTEM is not systemd!"
            exit 1
          fi
          if ! grep -q 'LB_FIRMWARE_CHROOT="false"' config/binary; then
            echo "ERROR: LB_FIRMWARE_CHROOT is not false!"
            exit 1
          fi
          if ! grep -q 'LB_MODE="debian"' config/common; then
            echo "ERROR: LB_MODE is not debian!"
            exit 1
          fi
          echo "Preflight Audit passed cleanly: rsvg wrapper verified, bootloader isolinux.bin and vesamenu.c32 binaries verified (no broken symlinks), debian-installer disabled, Systemd init, firmware-chroot disabled."

      - name: Build ISO
        run: |
          sudo lb build

      - name: Verify ISO
        run: |
          echo "=== Verifying ISO Artifact ==="
          ls -lh *.iso || true
          find . -maxdepth 2 -type f -name "*.iso" -size +100M
          test -n "$(find . -maxdepth 2 -type f -name '*.iso' -size +100M -print -quit)"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-OS-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
