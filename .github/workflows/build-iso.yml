
name: Build NOVA OS

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Unit Tests
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            syslinux-utils \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            debian-archive-keyring

      - name: Configure NOVA OS
        run: |
          mkdir -p config/package-lists
          mkdir -p config/archives
          mkdir -p config/hooks/normal
          mkdir -p config/bootloaders/isolinux

          cat > config/package-lists/nova.list.chroot <<'EOF'
          task-kde-desktop
          network-manager
          firefox-esr
          dolphin
          konsole
          kate
          plasma-nm
          systemsettings
          sudo
          calamares
          papirus-icon-theme
          linux-image-amd64
          live-boot
          live-config
          systemd-sysv
          firmware-linux
          firmware-linux-free
          firmware-misc-nonfree
          isolinux
          syslinux-common
          syslinux-utils
          EOF

          cat > config/archives/trixie-security.list.chroot <<'EOF'
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF

          cat > config/archives/trixie-security.list.binary <<'EOF'
          deb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware
          EOF

          cat > config/hooks/normal/0001-syslinux-symlinks.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          mkdir -p /usr/lib/syslinux
          if [ -f /usr/lib/ISOLINUX/isolinux.bin ]; then
              ln -sf /usr/lib/ISOLINUX/isolinux.bin /usr/lib/syslinux/isolinux.bin
          fi
          if [ -d /usr/lib/syslinux/modules/bios ]; then
              for f in /usr/lib/syslinux/modules/bios/*; do
                  if [ -f "$f" ]; then
                      ln -sf "$f" "/usr/lib/syslinux/$(basename "$f")"
                  fi
              done
          fi
          EOF
          chmod +x config/hooks/normal/0001-syslinux-symlinks.hook.chroot

          # Populate config/bootloaders/isolinux with REAL binary files instead of broken symlinks
          if [ -d /usr/share/live/build/bootloaders/isolinux ]; then
              cp -r /usr/share/live/build/bootloaders/isolinux/*.cfg config/bootloaders/isolinux/ 2>/dev/null || true
              cp -r /usr/share/live/build/bootloaders/isolinux/*.in config/bootloaders/isolinux/ 2>/dev/null || true
          fi

          if [ -f /usr/lib/ISOLINUX/isolinux.bin ]; then
              cp /usr/lib/ISOLINUX/isolinux.bin config/bootloaders/isolinux/isolinux.bin
          fi

          if [ -d /usr/lib/syslinux/modules/bios ]; then
              cp /usr/lib/syslinux/modules/bios/vesamenu.c32 config/bootloaders/isolinux/vesamenu.c32 2>/dev/null || true
              cp /usr/lib/syslinux/modules/bios/ldlinux.c32 config/bootloaders/isolinux/ldlinux.c32 2>/dev/null || true
              cp /usr/lib/syslinux/modules/bios/libcom32.c32 config/bootloaders/isolinux/libcom32.c32 2>/dev/null || true
              cp /usr/lib/syslinux/modules/bios/libutil.c32 config/bootloaders/isolinux/libutil.c32 2>/dev/null || true
              cp /usr/lib/syslinux/modules/bios/menu.c32 config/bootloaders/isolinux/menu.c32 2>/dev/null || true
              cp /usr/lib/syslinux/modules/bios/chain.c32 config/bootloaders/isolinux/chain.c32 2>/dev/null || true
          fi

          sudo lb config \
            --mode debian \
            --system live \
            --initsystem systemd \
            --distribution trixie \
            --architectures amd64 \
            --linux-packages "linux-image" \
            --linux-flavours "amd64" \
            --bootloader syslinux \
            --firmware-chroot false \
            --firmware-binary false \
            --security false \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --debian-installer false \
            --iso-application "NOVA OS" \
            --iso-publisher "NOVA Project" \
            --iso-volume "NOVA_OS"

      - name: Pre-build Audit & Verification
        run: |
          echo "=== Pre-build Audit & Verification ==="
          if [ ! -f config/bootloaders/isolinux/isolinux.bin ] || [ -L config/bootloaders/isolinux/isolinux.bin ]; then
            echo "ERROR: config/bootloaders/isolinux/isolinux.bin missing or is a symlink!"
            exit 1
          fi
          if [ ! -f config/bootloaders/isolinux/vesamenu.c32 ] || [ -L config/bootloaders/isolinux/vesamenu.c32 ]; then
            echo "ERROR: config/bootloaders/isolinux/vesamenu.c32 missing or is a symlink!"
            exit 1
          fi
          if grep -rn "trixie/updates" config/; then
            echo "ERROR: Outdated 'trixie/updates' suite found in configuration!"
            exit 1
          fi
          if grep -rn "linux-generic" config/; then
            echo "ERROR: linux-generic found in effective configuration!"
            exit 1
          fi
          if grep -E "sysvinit-core|live-config-sysvinit|initscripts" config/package-lists/; then
            echo "ERROR: Conflicting SysV init packages detected in package list!"
            exit 1
          fi
          if grep -wE "lilo|linux-image-2\.6-amd64" config/package-lists/ || grep -w "grub" config/package-lists/; then
            echo "ERROR: Obsolete package requested in package list!"
            exit 1
          fi
          if [ ! -x config/hooks/normal/0001-syslinux-symlinks.hook.chroot ]; then
            echo "ERROR: Syslinux chroot hook missing or not executable!"
            exit 1
          fi
          if ! grep -q 'LB_DEBIAN_INSTALLER="false"' config/binary; then
            echo "ERROR: LB_DEBIAN_INSTALLER is not false!"
            exit 1
          fi
          if ! grep -q 'LB_INITSYSTEM="systemd"' config/common; then
            echo "ERROR: LB_INITSYSTEM is not systemd!"
            exit 1
          fi
          if ! grep -q 'LB_FIRMWARE_CHROOT="false"' config/binary; then
            echo "ERROR: LB_FIRMWARE_CHROOT is not false!"
            exit 1
          fi
          if ! grep -q 'LB_MODE="debian"' config/common; then
            echo "ERROR: LB_MODE is not debian!"
            exit 1
          fi
          echo "Preflight Audit passed cleanly: Bootloader isolinux.bin and vesamenu.c32 binaries verified (no broken symlinks), debian-installer disabled, Systemd init, firmware-chroot disabled."

      - name: Build ISO
        run: |
          sudo lb build

      - name: Verify ISO
        run: |
          echo "=== Verifying ISO Artifact ==="
          ls -lh *.iso || true
          find . -maxdepth 2 -type f -name "*.iso" -size +100M
          test -n "$(find . -maxdepth 2 -type f -name '*.iso' -size +100M -print -quit)"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-OS-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
