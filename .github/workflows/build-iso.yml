
name: Build NOVA OS

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            debian-archive-keyring

      - name: Configure NOVA OS
        run: |
          mkdir -p config/package-lists

          cat > config/package-lists/nova.list.chroot <<'EOF'
          task-kde-desktop
          network-manager
          firefox-esr
          dolphin
          konsole
          kate
          plasma-nm
          systemsettings
          sudo
          calamares
          papirus-icon-theme
          linux-image-amd64
          live-boot
          live-config
          live-config-systemd
          EOF

          sudo lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --linux-packages "linux-image" \
            --linux-flavours "amd64" \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap http://deb.debian.org/debian \
            --mirror-chroot http://deb.debian.org/debian \
            --mirror-binary http://deb.debian.org/debian \
            --mirror-chroot-security http://security.debian.org/debian-security \
            --mirror-binary-security http://security.debian.org/debian-security \
            --debian-installer live \
            --iso-application "NOVA OS" \
            --iso-publisher "NOVA Project" \
            --iso-volume "NOVA_OS"
            
      - name: Build ISO
        run: |
          sudo lb build

      - name: Verify ISO
        run: |
          find . -maxdepth 2 -type f -name "*.iso" -size +100M
          test -n "$(find . -maxdepth 2 -type f -name '*.iso' -size +100M -print -quit)"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-OS-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
